name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Formatação, lint, testes e cobertura
        run: mvn -B -ntp verify

      - name: Smoke test do JAR
        run: |
          set -euo pipefail
          jar=$(ls target/calculadora-java-*.jar)
          test "$(java -jar "$jar" '2 + 3 * (4 - 1)')" = "11"
          if java -jar "$jar" '1 / 0'; then
            echo "divisão por zero deveria falhar" >&2
            exit 1
          fi
          printf '1\n2\n3\n0\n' | java -jar "$jar" | grep -q 'Resultado: 2 + 3 = 5'

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
